[project]
name = "python-video-backup"
version = "1.0"
description = "個人用的影片備份腳本"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "aiopathlib>=0.7.0",
    "aioshutil>=1.6",
    "tqdm>=4.69.0",
    "yt-dlp[default]>=2026.7.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.00",
    "snakeviz>=2.2.2",
    "yappi>=1.7.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
